<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Tracker · Simple & Friendly</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #f4f7fb;
      padding: 2rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      max-width: 1400px;
      width: 100%;
    }

    /* header */
    .header-simple {
      background: white;
      padding: 1.5rem 2rem;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,40,80,0.05);
      margin-bottom: 24px;
      border: 1px solid #e9eef2;
    }

    .header-simple h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #0b2b40;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
    }

    .header-simple h1 span {
      background: #ecf7ff;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 500;
      color: #0077be;
      margin-left: 12px;
    }

    /* card style */
    .card {
      background: white;
      border-radius: 28px;
      padding: 1.8rem 2rem;
      box-shadow: 0 15px 30px -12px rgba(0,32,64,0.12);
      border: 1px solid #e2e9f0;
      transition: box-shadow 0.2s;
      margin-bottom: 28px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 500;
      color: #1e3b5c;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title i {
      font-size: 1.5rem;
      color: #2a7faa;
    }

    /* form grid */
    .form-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 20px;
      align-items: flex-end;
    }

    .input-field {
      flex: 1 1 180px;
      min-width: 160px;
    }

    .input-field label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      font-weight: 600;
      color: #4a617c;
      margin-bottom: 4px;
    }

    .input-field input,
    .input-field select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1.5px solid #d8e2ec;
      background: white;
      font-size: 0.95rem;
      transition: 0.15s;
      outline: none;
    }

    .input-field input:focus,
    .input-field select:focus {
      border-color: #2f8fc0;
      box-shadow: 0 0 0 3px rgba(47,143,192,0.2);
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 0.5rem;
      margin-left: auto;
    }

    .btn {
      border: none;
      background: #f0f4fa;
      padding: 12px 26px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      color: #1d3a5a;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: #005f8c;
      color: white;
      box-shadow: 0 4px 8px rgba(0,95,140,0.25);
    }
    .btn-primary:hover { background: #004b70; }

    .btn-success {
      background: #1e7e34;
      color: white;
      box-shadow: 0 4px 8px rgba(30,126,52,0.2);
    }
    .btn-success:hover { background: #166b2a; }

    .btn-outline {
      background: white;
      border: 1.5px solid #cbd6e4;
    }
    .btn-outline:hover { background: #f5f9ff; }

    .btn-danger {
      background: #b13e3e;
      color: white;
    }
    .btn-danger:hover { background: #942e2e; }

    /* search row — minimal */
    .search-row {
      margin-bottom: 24px;
      background: white;
      border-radius: 60px;
      padding: 4px 4px 4px 20px;
      display: flex;
      align-items: center;
      border: 1.5px solid #d3e0ea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .search-row i {
      font-size: 1.2rem;
      color: #7f99b6;
      margin-right: 8px;
    }

    .search-row input {
      flex: 1;
      border: none;
      padding: 16px 6px 16px 0;
      font-size: 1rem;
      background: transparent;
      outline: none;
    }

    .search-row input::placeholder {
      color: #98aec9;
      font-weight: 400;
    }

    .search-row button {
      background: #005f8c;
      border: none;
      color: white;
      padding: 12px 32px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.1s;
      white-space: nowrap;
      margin-left: 4px;
      border: 1px solid #00507a;
    }

    .search-row button:hover {
      background: #004368;
    }

    .search-hint {
      font-size: 0.9rem;
      color: #30658a;
      margin: 8px 0 0 6px;
      background: #e2eff9;
      padding: 6px 16px;
      border-radius: 30px;
      display: inline-block;
    }

    /* table */
    .table-wrapper {
      background: white;
      border-radius: 26px;
      padding: 0.5rem 0.2rem 1rem 0.2rem;
      box-shadow: 0 15px 30px -12px rgba(0,32,64,0.12);
      border: 1px solid #e2e9f0;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      min-width: 900px;
    }

    th {
      text-align: left;
      padding: 1.2rem 1rem 0.8rem 1.5rem;
      color: #385c7e;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border-bottom: 2px solid #dde5ef;
    }

    td {
      padding: 1rem 1rem 1rem 1.5rem;
      border-bottom: 1px solid #eaeff5;
      color: #1e3b4f;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: #f6fafe;
    }

    .match-highlight {
      background-color: #fdefd4;
      font-weight: 600;
      color: #b65700;
      border-radius: 20px;
      padding: 3px 10px;
      display: inline-block;
    }

    .actions-cell {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-icon {
      background: none;
      border: 1px solid #cdddec;
      border-radius: 30px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      color: #2a4c6e;
      transition: 0.1s;
    }
    .btn-icon:hover {
      background: #e3effa;
      border-color: #7ba3c7;
    }
    .btn-icon.delete:hover {
      background: #ffebeb;
      color: #b13e3e;
      border-color: #e0b3b3;
    }

    .empty-message {
      padding: 3rem;
      text-align: center;
      color: #7a94b0;
      font-size: 1.1rem;
    }

    /* modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: white;
      max-width: 360px;
      width: 90%;
      padding: 2rem 1.8rem;
      border-radius: 48px;
      box-shadow: 0 30px 60px rgba(0,20,40,0.4);
      text-align: center;
    }
    .modal-card h3 {
      font-size: 1.7rem;
      font-weight: 500;
      color: #1d3e5e;
      margin-bottom: 0.5rem;
    }
    .modal-card p {
      color: #3d5f7f;
    }
    .modal-card input {
      width: 100%;
      padding: 15px 20px;
      border-radius: 60px;
      border: 1.5px solid #c7d9ec;
      margin: 20px 0 16px;
      font-size: 1rem;
      outline: none;
    }
    .modal-card input:focus {
      border-color: #005f8c;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- simple header -->
  <div class="header-simple">
    <h1>
      📋 Rider Absconding Tracker
      <span>Store Name : KFC Horamavu K281 </span>
    </h1>
  </div>

  <!-- entry card (form) -->
  <div class="card">
    <div class="card-title">
      <span>➕</span> Add / edit record
    </div>
    <div class="form-grid">
      <div class="input-field">
        <label>Rider name</label>
        <input type="text" id="riderName" placeholder="e.g. John Doe" autocomplete="off">
      </div>
      <div class="input-field">
        <label>Order ID</label>
        <input type="text" id="orderId" placeholder="K281">
      </div>
      <div class="input-field">
        <label>Order value</label>
        <input type="text" id="orderValue" placeholder="₹999">
      </div>
      <div class="input-field">
        <label>Phone</label>
        <input type="tel" id="phoneNumber" placeholder="1234567890">
      </div>
      <div class="input-field">
        <label>Remarks</label>
        <select id="remarks">
          <option value="Rider Absconded with order">Absconded with order</option>
          <option value="Rider misbehaved with customer">Misbehaved with customer</option>
          <option value="Wrong address delivered">Wrong address delivered</option>
          <option value="Other issue">Other issue</option>
        </select>
      </div>
      <div class="action-buttons">
        <button class="btn btn-primary" onclick="addOrUpdate()">💾 Save</button>
        <button class="btn btn-outline" onclick="clearForm()">🗑️ Clear form</button>
        <button class="btn btn-danger" onclick="showPasswordModal()">⚠️ Clear all</button>
        <button class="btn btn-success" onclick="exportToExcel()">📎 Export .csv</button>
      </div>
    </div>
  </div>

  <!-- SEARCH — simple, no extra clear button, live on input -->
  <div style="margin-bottom: 12px;">
    <div class="search-row">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Type name, phone or order ID — instant match" autocomplete="off">
      <button id="searchButton">Search</button>
    </div>
    <div id="searchInfo" class="search-hint" style="display: none;">
      showing <span id="matchCount">0</span> matches for “<span id="searchTerm"></span>”
    </div>
  </div>

  <!-- table wrapper -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr><th>#</th><th>Rider name</th><th>Order ID</th><th>Value</th><th>Phone</th><th>Remarks</th><th>Date</th><th>Actions</th></tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="8" class="empty-message">loading entries...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- password modal (hidden by default) -->
<div id="passwordModal" class="modal-overlay" style="display: none;">
  <div class="modal-card">
    <h3>🔐 clear all</h3>
    <p>type password to delete everything</p>
    <input type="password" id="passwordInput" placeholder="password">
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="verifyPassword()">Confirm</button>
      <button class="btn btn-outline" onclick="closePasswordModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- firebase sdk -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  (function() {
    // firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCMcTi-dZnWVgeTFg17rLZwDaHJCM4RF08",
      authDomain: "real-time-502b1.firebaseapp.com",
      projectId: "real-time-502b1",
      storageBucket: "real-time-502b1.firebasestorage.app",
      messagingSenderId: "483376670752",
      appId: "1:483376670752:web:366d8934a004c8372bf445",
      measurementId: "G-NVV0L581GB",
      databaseURL: "https://real-time-502b1-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const dataRef = database.ref("riderAbsconding");

    // state
    let snapshotStore = {};           // all records key->value
    let editKey = null;
    let searchTerm = "";              // current lowerCase search

    // DOM elements
    const tbody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const searchInfo = document.getElementById('searchInfo');
    const matchCountSpan = document.getElementById('matchCount');
    const searchTermSpan = document.getElementById('searchTerm');

    // ========== render with live highlighting ==========
    function renderTable() {
      const entries = Object.entries(snapshotStore);  // [[key, value], ...]
      let filtered = entries;

      if (searchTerm.trim() !== '') {
        const term = searchTerm.toLowerCase().trim();
        filtered = entries.filter(([_, e]) => {
          const name = (e.name || '').toLowerCase();
          const phone = (e.phone || '').toLowerCase();
          const orderId = (e.orderId || '').toLowerCase();
          const remarks = (e.remarks || '').toLowerCase();
          return name.includes(term) || phone.includes(term) || orderId.includes(term) || remarks.includes(term);
        });
      }

      // update search info
      if (searchTerm.trim() !== '') {
        searchInfo.style.display = 'inline-block';
        matchCountSpan.textContent = filtered.length;
        searchTermSpan.textContent = searchTerm;
      } else {
        searchInfo.style.display = 'none';
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty-message">✗ no records found</td></tr>`;
        return;
      }

      // sort by timestamp desc (newest first)
      filtered.sort((a, b) => {
        const tA = new Date(a[1].timestamp || 0);
        const tB = new Date(b[1].timestamp || 0);
        return tB - tA;
      });

      let html = '';
      filtered.forEach(([key, entry], idx) => {
        const serial = idx + 1;
        const name = entry.name || '';
        const orderId = entry.orderId || '';
        const orderValue = entry.orderValue || '';
        const phone = entry.phone || '';
        const remarks = entry.remarks || '';
        const date = entry.timestamp || '';

        // helper to wrap matching parts if search active
        const highlight = (text, field) => {
          if (!searchTerm || !text) return text;
          const lowerText = text.toString().toLowerCase();
          const lowerSearch = searchTerm.toLowerCase();
          if (!lowerText.includes(lowerSearch)) return text;
          const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
          return text.toString().replace(regex, `<span class="match-highlight">$1</span>`);
        };

        html += `<tr>`;
        html += `<td>${serial}</td>`;
        html += `<td>${highlight(name)}</td>`;
        html += `<td>${highlight(orderId)}</td>`;
        html += `<td>${orderValue}</td>`;
        html += `<td>${highlight(phone)}</td>`;
        html += `<td>${highlight(remarks)}</td>`;
        html += `<td>${date}</td>`;
        html += `<td class="actions-cell">
          <button class="btn-icon" onclick="window.editEntry('${key}')">✎ edit</button>
          <button class="btn-icon delete" onclick="window.deleteEntry('${key}')">🗑 delete</button>
        </td>`;
        html += `</tr>`;
      });
      tbody.innerHTML = html;
    }

    // listen to firebase
    dataRef.on('value', (snap) => {
      snapshotStore = snap.val() || {};
      renderTable();
    });

    // ========== global functions ==========
    window.addOrUpdate = function() {
      const name = document.getElementById('riderName').value.trim();
      const orderId = document.getElementById('orderId').value.trim();
      const orderValue = document.getElementById('orderValue').value.trim();
      const phone = document.getElementById('phoneNumber').value.trim();
      const remarks = document.getElementById('remarks').value;

      if (!name || !orderId || !orderValue || !phone) {
        alert('please fill all required fields');
        return;
      }

      const entry = {
        name, orderId, orderValue, phone, remarks,
        timestamp: new Date().toLocaleString()
      };

      if (editKey) {
        database.ref(`riderAbsconding/${editKey}`).update(entry)
          .then(() => { clearForm(); editKey = null; alert('updated'); })
          .catch(err => alert('update error: ' + err.message));
      } else {
        dataRef.push(entry)
          .then(() => clearForm())
          .catch(err => alert('error: ' + err.message));
      }
    };

    window.clearForm = function() {
      document.getElementById('riderName').value = '';
      document.getElementById('orderId').value = '';
      document.getElementById('orderValue').value = '';
      document.getElementById('phoneNumber').value = '';
      document.getElementById('remarks').selectedIndex = 0;
      editKey = null;
    };

    // edit entry (populates form)
    window.editEntry = function(key) {
      const entry = snapshotStore[key];
      if (!entry) return;
      document.getElementById('riderName').value = entry.name || '';
      document.getElementById('orderId').value = entry.orderId || '';
      document.getElementById('orderValue').value = entry.orderValue || '';
      document.getElementById('phoneNumber').value = entry.phone || '';
      document.getElementById('remarks').value = entry.remarks || '';
      editKey = key;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteEntry = function(key) {
      if (confirm('delete this entry?')) {
        database.ref(`riderAbsconding/${key}`).remove();
      }
    };

    // password modal
    window.showPasswordModal = function() {
      document.getElementById('passwordModal').style.display = 'flex';
      document.getElementById('passwordInput').value = '';
    };
    window.closePasswordModal = function() {
      document.getElementById('passwordModal').style.display = 'none';
    };
    window.verifyPassword = function() {
      const pwd = document.getElementById('passwordInput').value;
      if (pwd === '211225') {
        closePasswordModal();
        if (confirm('Delete ALL entries? cannot be undone.')) {
          dataRef.remove().catch(e => alert(e.message));
        }
      } else {
        alert('incorrect password');
        document.getElementById('passwordInput').value = '';
      }
    };

    window.exportToExcel = function() {
      const entries = Object.values(snapshotStore);
      if (!entries.length) return alert('no data');
      const header = ['Sr No.','Rider Name','Order ID','Order Value','Phone','Remarks','Date'];
      const rows = entries.map((e,i) => [i+1, e.name, e.orderId, e.orderValue, e.phone, e.remarks, e.timestamp]);
      let csv = header.join(',') + '\n' + rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
      const link = document.createElement('a');
      link.href = 'data:text/csv;charset=utf-8,' + encodeURI(csv);
      link.download = `riders_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    };

    // search: live as you type (no separate clear button)
    function updateSearch() {
      searchTerm = searchInput.value;
      renderTable();
    }

    searchInput.addEventListener('input', updateSearch);
    // optional: keep search button for explicit action, but it also just calls same
    document.getElementById('searchButton').addEventListener('click', () => {
      searchTerm = searchInput.value; // already live but ensures consistency
      renderTable();
    });

    // initialize placeholder
    renderTable();
  })();
</script>
</body>
</html>
